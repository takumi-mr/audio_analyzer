[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "scratch",
    "temp_uploads",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends/File)
    "RUF001", # Ambiguous characters in string (allow Japanese punctuation)
    "RUF002", # Ambiguous characters in docstring (allow Japanese punctuation)
    "RUF003", # Ambiguous characters in comment (allow Japanese punctuation)
]

[tool.ruff.lint.per-file-ignores]
# 外部モデルの移植コードに対するルール緩和
"model/btc/**" = ["RUF059", "F841", "B905"]
# テストコードに対するルール緩和
"tests/**" = ["B011", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
